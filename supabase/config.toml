# Supabase CLI configuration for local development and CI (`supabase start`, `supabase test db`).
#
# The hosted project is "CUSTAR Tutor" (kjmjyxherydvefwtzmez, eu-west-1). It is the DEV database until
# real families onboard; production gets its own project. Git is the source of truth for the schema:
# see supabase/migrations/README.md.
#
# Hosted-only settings that are NOT configured here (set them in the dashboard):
#   * admin accounts must enrol TOTP MFA (every admin policy and RPC requires aal2);
#   * email OTP / Google providers and custom SMTP for guardian sign-in;
#   * the exposed schemas must stay ["public"] (the `private` schema must never be exposed).

project_id = "custartutor"

[api]
enabled = true
port = 54321
# `private` holds SECURITY DEFINER helpers and RPC implementations: it must never be exposed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Private bucket for lesson packs (ADR 0004). NO policy on storage.objects: only the service role used by the
# edge functions reads or writes it; learners get signed URLs from `get-pack-download`. On the hosted project
# the bucket is created by the pack_publishing migration; this block creates it for `supabase start`.
[storage.buckets.packs]
public = false
file_size_limit = "50MiB"
allowed_mime_types = [
  "application/json",
  "image/webp",
  "image/png",
  "image/jpeg",
  "audio/mpeg",
  "audio/mp4",
  "audio/aac",
  "audio/ogg",
  "audio/webm",
  "audio/wav",
]

# Private bucket for uploaded schemes of work (M2 content engine): PDF, DOCX or plain text, 20 MiB. Objects live
# under <auth.uid()>/...; the policies on storage.objects (content staff at aal2, own prefix only, insert/select
# only) come from the m2_scheme_uploads_bucket migration. On the hosted project that migration creates the bucket
# too; this block creates it for `supabase start`.
[storage.buckets.scheme-uploads]
public = false
file_size_limit = "20MiB"
allowed_mime_types = [
  "application/pdf",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "text/plain",
]

# Edge functions. The platform verifies the JWT; each function also asks the database who the caller is.
[functions.get-pack-download]
verify_jwt = true

[functions.publish-pack]
verify_jwt = true

# Content engine (M2): one request per job step (ADR 0007). The function checks the caller's role and aal2 itself
# and uses the service role only for the ai_job_* lease/state/usage RPCs. Secrets: ANTHROPIC_API_KEY (Edge
# Function secret) and, optionally, ALLOWED_ORIGINS (comma-separated browser origins of the admin app).
[functions.ai-job]
verify_jwt = true

# The AI tutor (M3, ADR 0008): one turn per request, answered as Server-Sent Events. The function authenticates the caller,
# checks that the child belongs to a household the caller is a guardian of, applies the gates (tutor.enabled, kill switch,
# consent, daily budget, one turn in flight) and uses the service role only for the tutor_* RPCs. Secrets:
# ANTHROPIC_API_KEY (Edge Function secret) and, optionally, ALLOWED_ORIGINS. The tutor is OFF until a super_admin confirms
# the safeguarding owner and calls set_tutor_enabled.
[functions.tutor-chat]
verify_jwt = true
